spring:
  profiles:
    default: dev
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
info:
  app:
    name: Purchases
